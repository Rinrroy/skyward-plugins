name: chromium

# Builds the full mode's Linux root: a Debian arm64 file system with Chromium
# in it. It is not a plugin in the sense webview/ is: it is the page drawer
# the browser installs when the data partition is readable.
#
# The NDK is x86_64-only, so the recovery itself builds on ubuntu-24.04; this
# root has to be arm64 and so builds on the arm64 runner.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish
        default: 1.0
        required: true
  push:
    paths:
      - chromium/**
      - .github/workflows/chromium.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Say what this runner is
        run: uname -a && dpkg --print-architecture

      - name: Build the root
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version=1.0
          bash ./chromium/build.sh "$version"

      - name: Keep what was built
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version=1.0
          mkdir -p dist
          mv "chromium-$version-arm64.tar.gz" dist/
          mv "chromium-$version-arm64.tar.gz.sha256" dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: chromium-arm64
          path: dist/*
          retention-days: 14

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version=1.0
          tag="chromium-$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already published: the version has to change to publish again"
            exit 0
          fi
          gh release create "$tag" dist/* \
            --title "Chromium $version" \
            --notes "The full mode's Linux root for the recovery browser: a Debian arm64 file system with Chromium $(cat .work/chromium/version.txt 2>/dev/null || echo '').

          Put chromium-$version-arm64.tar.gz at /sdcard/Skyward/plugins/ or /sdcard/Download/Skyward/, then install it from the browser's full mode page."
